[package]
name = "tlsn-prover-service"
version = "0.1.0"
edition = "2021"
authors = ["Mihai Calin Luca <calin.luca@multiversx.com>"]
description = "HTTP service wrapper for TLSNotary prover functionality"

[dependencies]
tlsn-prover = { path = "../../crates/prover" }
tlsn-core = { path = "../../crates/core" }
tlsn-common = { path = "../../crates/common" }
tlsn-examples = { path = "../../crates/examples" }
tlsn-formats = { path = "../../crates/formats" }
notary-client = { path = "../../crates/notary/client" }

axum = "0.8"
axum-macros = "0.4"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

hyper = "1.0"
hyper-util = "0.1"
http-body-util = "0.1"

uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
eyre = "0.6"
thiserror = "1.0"
url = "2.5"
base64 = "0.22"
zip = "0.6"

config = "0.14"

tokio-util = { version = "0.7", features = ["compat"] }

reqwest = "0.12"
