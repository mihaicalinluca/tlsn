[server]
host = "0.0.0.0"
port = 8080
name = "prover-service"

# Fallback values, normally received from notary
[notary]
host = "127.0.0.1"
port = 7047
tls_enabled = false
timeout = 555555

# Fallback values, normally received from notary
[session]
max_sent_data = 131072  # 128KB - increased to provide more headroom for large requests
max_recv_data = 20971520

[target_server]
# Default target, can be overridden in requests
default_host = "https://api.multiversx.com/stats"
default_port = 443

[logging]
level = "DEBUG"

# Streaming response configuration
[streaming]
# Maximum number of retry attempts for streaming responses
max_retries = 10
# Delay between retry attempts in seconds
retry_delay_secs = 2
# Timeout for individual requests in seconds
request_timeout_secs = 30
# Custom headers to check for streaming detection (optional)
custom_streaming_headers = ["x-custom-stream", "x-processing-status"] 