[server]
host = "0.0.0.0"
port = 8080
name = "prover-service"

# Fallback values, normally received from notary
[notary]
host = "127.0.0.1"
port = 7047
tls_enabled = false
timeout = 555555

# Fallback values, normally received from notary
[session]
max_sent_data = 65536
max_recv_data = 20971520

[target_server]
# Default target, can be overridden in requests
default_host = "https://api.multiversx.com/stats"
default_port = 443

[logging]
level = "DEBUG" 